[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-harness-bench"
version = "0.1.0"
description = "Local, evidence-first Codex configuration comparisons powered by Harbor"
requires-python = ">=3.12"
dependencies = ["harbor==0.23.0"]

[project.scripts]
chb = "chb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
