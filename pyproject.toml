[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-harness-bench"
version = "0.1.0"
description = "Local, evidence-first Codex configuration comparisons powered by Harbor"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.23.0",
    "PyYAML>=6,<7",
    "tomlkit>=0.13,<1",
]

[project.scripts]
chb = "chb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chb = ["web/*.html", "web/*.css", "web/*.js"]
