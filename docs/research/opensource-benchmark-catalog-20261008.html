const catalog=JSON.parse(document.getElementById("catalog").textContent);const esc=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll("\"","&quot;");let filter="all",current="vision";const groups={flow:["vision","webgen","interaction"],visual:["artifacts","designbench","design2code"],quality:["slop","oneshot"],judge:["judge"]};const link=(url,label)=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`;function render(){const query=document.getElementById("search").value.trim().toLocaleLowerCase();const visible=catalog.filter(p=>(filter==="all"||groups[filter].includes(p.id))&&[p.name,p.category,p.standard,p.scoring,...p.tasks.map(t=>t.title+" "+t.summary)].join(" ").toLocaleLowerCase().includes(query));document.getElementById("count").textContent=`${visible.length} 个项目`;if(!visible.some(p=>p.id===current))current=visible[0]?.id||"";document.getElementById("projectButtons").innerHTML=visible.map(p=>`<button type="button" data-project="${esc(p.id)}" aria-pressed="${p.id===current}"><strong>${esc(p.name)}</strong><span>${esc(p.category)}</span></button>`).join("");document.getElementById("projectSelect").innerHTML=visible.map(p=>`<option value="${esc(p.id)}" ${p.id===current?"selected":""}>${esc(p.name)}</option>`).join("");const p=visible.find(p=>p.id===current);const detail=document.getElementById("detail");if(!p){detail.innerHTML="<h2 id=detail-title>没有匹配的项目</h2><p>换一个关键词，或选择全部。</p>";return;}detail.innerHTML=`<div class="article-top"><h2 id="detail-title">${esc(p.name)}</h2><span class="category">${esc(p.category)}</span></div><p class="scale">${esc(p.scale)}</p><div class="sources">${link("https://github.com/"+p.repo,"GitHub 仓库")}${link(p.taskUrl,"查看原题与数据")}${link(p.code,"查看评分代码")}${link(p.demo,"打开项目展示")}</div><dl><div><dt>评价标准</dt><dd>${esc(p.standard)}</dd></div><div><dt>分数怎么算</dt><dd>${esc(p.scoring)}</dd></div><div><dt>实际证据</dt><dd>${esc(p.evidence)}</dd></div><div><dt>仍有的局限</dt><dd>${esc(p.limits)}</dd></div></dl><p class="takeaway">${esc(p.takeaway)}</p><h3>样题摘要</h3>${p.tasks.map(t=>`<section class="task"><h4>${esc(t.title)}</h4><p class="id">${esc(t.id)}</p><p>${esc(t.summary)}</p><p><strong>验收要看：</strong>${esc(t.check)}</p>${link(t.url,"查看这道原题")}</section>`).join("")}<p class="version">核对日期：${esc(p.checkedAt)} · 仓库版本 ${esc(p.commit.slice(0,12))}。题目来源与当前实现的接入状态分别记录。</p>`;detail.scrollTop=0;}document.getElementById("projectButtons").addEventListener("click",event=>{const button=event.target.closest("button[data-project]");if(button){current=button.dataset.project;render();}});document.getElementById("projectSelect").addEventListener("change",event=>{current=event.target.value;render();});document.getElementById("search").addEventListener("input",render);document.querySelectorAll("button[data-filter]").forEach(button=>button.addEventListener("click",()=>{filter=button.dataset.filter;document.querySelectorAll("button[data-filter]").forEach(b=>b.setAttribute("aria-pressed",String(b===button)));render();}));render();
</script></body></html>
